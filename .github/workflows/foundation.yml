name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
